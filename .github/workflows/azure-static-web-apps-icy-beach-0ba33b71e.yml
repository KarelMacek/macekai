name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/azure-static-web-apps-icy-beach-0ba33b71e.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "landing/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/azure-static-web-apps-icy-beach-0ba33b71e.yml"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - uses: pnpm/action-setup@v4 # version comes from package.json's packageManager field — don't also set version: here, pnpm/action-setup errors on conflicting sources even when they agree
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build landing
        run: pnpm --filter landing build
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_BEACH_0BA33B71E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # With skip_app_build: true, this action uploads app_location
          # verbatim rather than joining app_location+output_location —
          # confirmed live 2026-08-10 (prod was serving the raw unbuilt
          # landing/index.html, not the built bundle, until this fix).
          # app_location must point directly at the already-built output.
          app_location: "landing/dist/public" # Built app content directory
          api_location: "" # Api source code path - optional
          output_location: "" # app_location already IS the output
          skip_app_build: true # We build explicitly above; Oryx auto-detect isn't reliable against a workspace root
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_BEACH_0BA33B71E }}
          action: "close"
