[project]
name = "app-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "gunicorn>=23",
    "whitenoise>=6.8",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "djangorestframework>=3.18.0",
    "drf-spectacular>=0.30.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.13.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
python_files = ["tests.py", "test_*.py"]
